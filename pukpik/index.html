<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ไข่ปุ๊กปิ๊ก ออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --sky:#CDEBF5;--sand:#F6E6C4;--paper:#FFFBF3;--paper-2:#FBF0DA;
  --ink:#33284A;--ink-soft:#6F6485;--line:#E3D3B3;
  --accent:#FF8A45;--good:#2FAE62;--hp:#F2485B;--mp:#3F86F5;--xp:#F5B324;
  --f-display:"Mali","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:calc(12px + env(safe-area-inset-left,0px));--gr:calc(12px + env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;font:15px/1.5 var(--f-body);color:var(--ink);background:#8CC973;overflow:hidden;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit}
input{font-family:inherit}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- shared ---------- */
.btn{appearance:none;font:700 16px/1.2 var(--f-display);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);min-height:48px;padding:10px 16px;cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent)}
.btn.block{width:100%}
.btn.sm{min-height:38px;font-size:14px;padding:6px 12px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--mp);outline-offset:3px}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:18px;box-shadow:0 3px 0 var(--ink);padding:12px}
.h{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.08em;color:var(--ink-soft);margin:0}
.muted{color:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--f-body);padding:2px 10px;border-radius:99px;border:2px solid var(--ink);background:var(--paper);white-space:nowrap}
.bar{position:relative;height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;transition:width .25s ease}
.bar.hp>i{background:linear-gradient(#FF8391,var(--hp))}
.bar.mp>i{background:linear-gradient(#86B3FF,var(--mp))}
.bar.xp>i{background:linear-gradient(#FFD877,var(--xp))}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF0B0,#F5B324 60%,#C98A0C);border:2px solid var(--ink);flex:none}
.blob-svg{display:block;width:100%;height:auto;overflow:visible}
.blob-body{transform-origin:60px 108px}
.bob .blob-body{animation:bob 1.8s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.sparkle{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sparkle.b{animation-delay:.8s}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(.96,1.04)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes rise{from{transform:translateY(12px);opacity:.3}to{transform:none;opacity:1}}

/* ---------- egg screen ---------- */
.screen{position:absolute;inset:0;z-index:30;overflow-y:auto;background-color:var(--sand);
  background-image:radial-gradient(circle at 18% 0%,#E8F7FB 0,transparent 50%),linear-gradient(180deg,var(--sky) 0%,#EAF2DC 48%,var(--sand) 100%)}
.egg-inner{max-width:480px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.logo{font:700 clamp(36px,10vw,48px)/1.3 var(--f-display);margin:0;color:var(--ink);text-shadow:3px 3px 0 var(--accent)}
.egg-stage{position:relative;width:min(62vw,240px);aspect-ratio:1;max-width:100%;display:grid;place-items:center;flex:none}
.egg-btn{position:relative;z-index:2;background:none;border:0;padding:0;width:66%;cursor:pointer;border-radius:50%}
.egg-btn svg{display:block;width:100%;height:auto;overflow:visible}
.wobble{animation:wobble .45s ease}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-4deg)}}
.egg-idle{animation:eggIdle 2.4s ease-in-out infinite;transform-origin:50% 92%}
@keyframes eggIdle{0%,100%{transform:rotate(0)}40%{transform:rotate(-3deg)}60%{transform:rotate(3deg)}}
.rays{position:absolute;inset:-18%;border-radius:50%;background:repeating-conic-gradient(var(--ray,#fff) 0 11deg,transparent 11deg 22deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);animation:spin 14s linear infinite;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
.hatched{position:relative;z-index:2;width:78%;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:60;animation:flash .8s ease forwards}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.egg-hint{font:600 15px var(--f-display);margin:0;min-height:1.5em}
.crack-meter{display:flex;gap:6px;justify-content:center}
.crack-meter i{width:22px;height:8px;border-radius:99px;border:2px solid var(--ink);background:#fff}
.crack-meter i.on{background:var(--accent)}
.odds{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.odd{display:flex;flex-direction:column;align-items:center;font:600 11px/1.3 var(--f-body)}
.odd .mini{width:100%;max-width:60px}
.odd b{font:700 13px var(--f-display)}
.reveal{width:100%;text-align:left;display:flex;flex-direction:column;gap:12px;animation:rise .5s ease both}
.stat-list{display:flex;flex-direction:column;gap:7px}
.stat-row{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:8px;font:600 13px var(--f-body)}
.stat-row .bar>i{background:#CFC4DE}
.stat-row.main .bar>i{background:var(--c)}
.stat-row .lbl{color:var(--ink-soft)}
.stat-row.main .lbl{color:var(--ink)}
.stat-row .val{text-align:right;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px;font:600 13px var(--f-body)}
.field input,.chatbar input{font:600 17px var(--f-display);padding:10px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text;width:100%}
.field input:focus,.chatbar input:focus{outline:3px solid var(--mp);outline-offset:1px}
.id-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sk-row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--line)}
.sk-row:last-child{border-bottom:0}
.sk-row.locked{opacity:.55}
.sk-row .skill-ico{width:48px;height:48px;font-size:24px}
.sk-row .nm{font:700 16px var(--f-display)}
.sk-row .ds{font-size:12.5px;color:var(--ink-soft);line-height:1.4}
.pips{display:inline-flex;gap:3px;vertical-align:1px;margin-left:4px}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);background:#fff}
.pips i.on{background:var(--accent)}
.skill-card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.skill-ico{width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center;font-size:22px;background:var(--c-light)}
.how{text-align:left;font-size:13px;color:var(--ink-soft);margin:0;padding-left:18px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
.me-card{position:absolute;top:10px;left:var(--gl);width:min(52vw,260px);display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;background:var(--paper);border:2px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:6px 10px 7px 6px}
.me-card .face{width:44px;height:44px;border-radius:12px;background:var(--c-light,#eee);border:2px solid var(--ink);padding:2px}
.me-card .nm{display:flex;justify-content:space-between;gap:6px;font:700 13px var(--f-display);white-space:nowrap}
.me-card .nm b{overflow:hidden;text-overflow:ellipsis}
.me-card .nm span{font:600 12px var(--f-body);color:var(--ink-soft)}
.me-card .bars{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.me-card .bar{height:10px;border-width:1.5px}
.me-card .bar.xp{height:7px}
.me-card .bar span{position:absolute;inset:0;font:700 8px/7px var(--f-body);text-align:center;color:var(--ink)}
.menu-row{position:absolute;top:84px;left:var(--gl);display:flex;gap:6px}
.pet-hud{position:absolute;top:138px;left:var(--gl);display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:0 2px 0 var(--ink);padding:4px 10px 4px 6px;cursor:pointer;font:600 12px var(--f-body);color:var(--ink);text-align:left}
.pet-hud .pe{font-size:26px;line-height:1}
.pet-hud .pm{font-size:18px;line-height:1;margin-left:-12px;margin-top:-18px;animation:petbob 1.6s ease-in-out infinite}
.pet-hud .pinfo{display:flex;flex-direction:column;gap:1px;min-width:78px}
.pet-hud .pinfo small{font:600 10px var(--f-body);opacity:.75}
.pet-hud .bar.hunger{height:6px;border:1.5px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden}
.pet-hud .bar.hunger i{display:block;height:100%;background:#FFB347}
@keyframes petbob{50%{transform:translateY(-3px)}}
.ibtn{width:39px;height:39px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);font-size:19px;line-height:1;display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ibtn .dot{position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--hp);border:2px solid var(--paper)}
.side{position:absolute;top:10px;right:var(--gr);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:150px;height:52px;border:2px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);background:#86C66A;display:block}
.gold{display:inline-flex;align-items:center;gap:5px;font:700 14px var(--f-display);font-variant-numeric:tabular-nums;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:1px 10px 1px 3px}
.online{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--f-body);background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:1px 9px}
.online i{width:8px;height:8px;border-radius:50%;background:#B7B0C4}
.online.on i{background:var(--good)}
.banner{position:absolute;top:128px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none!important;color:#fff;
  text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);animation:banner 2.6s ease forwards;white-space:nowrap}
.banner b{display:block;font:700 26px var(--f-display)}
.banner span{font:600 14px var(--f-body)}
@keyframes banner{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.chatlog{position:absolute;left:var(--gl);bottom:132px;width:min(64vw,320px);display:flex;flex-direction:column;gap:2px;pointer-events:none!important}
.chatlog p{margin:0;font:600 13px/1.35 var(--f-body);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.7);overflow-wrap:anywhere;animation:rise .2s ease}
.chatlog p b{color:#FFE08A}
.chatlog p.sys{color:#E6F3FF;font-weight:500}
.acts{position:absolute;right:var(--gr);bottom:18px;width:96px;height:96px;pointer-events:none!important}
/* skill hotbar: square slots in a row along the bottom (potion + skills 1-5) */
.hotbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;padding:8px 10px;background:rgba(51,40,74,.55);border:2px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);--slot:56px}
.hotbar .abtn{position:relative;right:auto!important;bottom:auto!important;width:var(--slot)!important;height:var(--slot)!important;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.hotbar .abtn[hidden]{display:none}
@media (max-width:700px){.hotbar{left:var(--gl);transform:none;gap:4px;padding:5px;--slot:min(48px,calc((100vw - 170px) / 6))}.hotbar .abtn{font-size:20px!important}.hotbar .abtn small{font-size:9px;bottom:2px}}
.acts>*{pointer-events:auto}
.abtn{position:absolute;border-radius:50%;border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;overflow:visible;touch-action:none}
.abtn:active,.abtn.held{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.abtn .cd{position:absolute;inset:0;border-radius:inherit;background:conic-gradient(rgba(51,40,74,.55) var(--p,0%),transparent 0);pointer-events:none}
.abtn small{position:absolute;bottom:4px;left:0;right:0;text-align:center;font:700 10px var(--f-body);color:var(--ink)}
.abtn.atk{right:0;bottom:0;width:92px;height:92px;background:#FFC2AE;font-size:36px}
.abtn.skl{width:54px;height:54px;background:var(--c-light,#FFE08A);font-size:24px}
.abtn.skl.s0{right:163px;bottom:19px}.abtn.skl.s1{right:152px;bottom:74px}.abtn.skl.s2{right:121px;bottom:121px}.abtn.skl.s3{right:74px;bottom:152px}.abtn.skl.s4{right:19px;bottom:163px;background:linear-gradient(135deg,#FFE08A,#FFB3C7,#B7D8FF)}
.abtn.skl.lock{background:#E6E0EE;font-size:18px}
.abtn.skl.lock small{color:var(--ink-soft)}
.abtn.skl.nomp{filter:grayscale(.8);opacity:.75}
.abtn.pot{right:173px;bottom:173px;width:50px;height:50px;background:#FFE3A1;font-size:21px}
.abtn.pot b{position:absolute;top:2px;right:8px;font:700 12px var(--f-display)}
.abtn:disabled{filter:grayscale(.7);opacity:.7}
.formbtn{position:absolute;right:var(--gr);top:150px;font:700 15px var(--f-display);padding:8px 16px;border-radius:99px;border:2px solid var(--ink);background:linear-gradient(90deg,#FFE08A,#FFB3C7,#B7D8FF);box-shadow:0 3px 0 var(--ink);cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.fcard{border:2px solid var(--ink);border-radius:16px;background:#fff;padding:6px 8px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.fcard .pic{width:74px}
.fcard b{font:700 14px/1.25 var(--f-display)}
.fcard .arch{font:600 11px var(--f-body);color:var(--ink-soft)}
.fcard .odds{font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.fcard .odds small{font:600 11px var(--f-body);color:var(--ink-soft)}
.fcard.hi{background:#FFF3B0;transform:scale(1.06);box-shadow:0 0 0 3px var(--accent)}
.fcard.win{background:#FFF3B0;box-shadow:0 0 0 4px var(--accent),0 0 24px #FFD23F}
.fcard.dim{opacity:.4}
.fcard.secret{background:#2B2140;color:#F1E8FF;border-color:#2B2140}
.fcard.secret .arch,.fcard.secret .odds small{color:#C9B8E8}
.fcard.secret .pic{filter:brightness(0) invert(.25);opacity:.8}
.fcard.secret.known .pic{filter:none;opacity:1}
.fcard.secret.hi,.fcard.secret.win{background:#4A3A70}
.dg-card{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.dg-card .big{font-size:38px;line-height:1.1;text-align:center}
.dg-card .nm{font:700 17px var(--f-display)}
.dg-card .ds{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.tiers{display:flex;flex-wrap:wrap;gap:6px}
.tiers .btn{min-height:32px;font-size:12.5px;padding:3px 10px;box-shadow:0 2px 0 var(--ink)}
.tiers .btn.on{background:var(--accent)}
.adm{display:flex;flex-direction:column;gap:8px}
.adm .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.adm .grid .btn{min-height:0;padding:4px;font-size:12px;border-radius:12px;box-shadow:0 2px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:0}
.adm .grid .btn .pic{width:52px}
.adm .grid .btn.on{background:#FFF3B0;outline:3px solid var(--accent)}
.adm .row2{display:flex;flex-wrap:wrap;gap:6px}
.adm .row2 .btn{min-height:34px;font-size:12.5px;padding:4px 10px;box-shadow:0 2px 0 var(--ink)}
.oddbar{height:6px;width:100%;border-radius:99px;background:#EEE8F4;overflow:hidden}
.oddbar i{display:block;height:100%;background:var(--accent)}
.story p{margin:0 0 10px;font:500 15px/1.7 var(--f-body)}
.story p:last-child{font-weight:700;color:#7B4FD8}
.talk.enc{bottom:180px;background:#FF6B6B;color:#fff;animation:rise .2s ease, pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.talk{position:absolute;right:var(--gr);bottom:130px;font:700 15px var(--f-display);padding:8px 16px;border-radius:99px;border:2px solid var(--ink);background:var(--accent);box-shadow:0 3px 0 var(--ink);cursor:pointer;animation:rise .2s ease}
.joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);background:rgba(51,40,74,.18);pointer-events:none!important;z-index:6}
.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.9);border:2.5px solid var(--ink)}
.kb{display:none;position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font:700 10px/1 var(--f-body);color:var(--paper);background:var(--ink);border-radius:6px;padding:3px 5px;white-space:nowrap;pointer-events:none}
.desk .kb{display:block}
.desk .abtn .kb{bottom:auto;top:-14px;font-size:11px;padding:3px 6px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
/* hotkey tags sit outside the round buttons, beside each one, so they never cover the icon */
.desk .hotbar .abtn .kb{top:-11px;left:50%;right:auto;transform:translateX(-50%)}
.desk .abtn small{display:none}
.desk .abtn.atk{width:80px;height:80px;font-size:32px}

.desk #cv{cursor:crosshair}
.desk #cv.over-mon{cursor:pointer}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:14px}
.keys kbd{font:700 12px var(--f-body);background:var(--paper-2);border:2px solid var(--ink);border-bottom-width:3px;border-radius:8px;padding:2px 7px;white-space:nowrap;justify-self:start}
.joyhint{position:absolute;left:var(--gl);bottom:88px;font:600 12px var(--f-body);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);pointer-events:none!important;max-width:40vw}
.dead{position:absolute;inset:0;display:grid;place-items:center;background:rgba(51,40,74,.45);text-align:center;color:#fff;z-index:7;text-shadow:0 2px 0 var(--ink)}
.dead b{display:block;font:700 28px var(--f-display)}
.chatbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;padding:10px var(--gr) 10px var(--gl);background:var(--paper);border-top:2px solid var(--ink)}
.chatbar .btn{flex:none}

/* ---------- sheets ---------- */
.modal-wrap{position:absolute;inset:0;z-index:40;background:rgba(51,40,74,.5);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal{position:relative;width:100%;max-width:460px;max-height:100%;overflow-y:auto;background:var(--paper);border:2px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:16px 14px 14px;display:flex;flex-direction:column;gap:12px;animation:sheet .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal>.h{font-size:22px;padding-right:44px}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--paper-2);font:700 18px var(--f-display);cursor:pointer}
.m-body{display:flex;flex-direction:column;gap:12px}
.center{text-align:center}
.m-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.eq-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{position:relative;aspect-ratio:1;border:2px solid var(--ink);border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;cursor:pointer;padding:0}
.slot.empty{background:var(--paper-2);color:var(--ink-soft);font:600 10px var(--f-body);border-style:dashed}
.slot.sel{outline:3px solid var(--mp);outline-offset:2px}
.slot.picked{outline:3px solid var(--hp);outline-offset:2px;background:#FFE3E6}
.slot.picked::after{content:"✓";position:absolute;top:-7px;left:-7px;width:20px;height:20px;border-radius:50%;background:var(--hp);color:#fff;border:2px solid var(--ink);font:700 12px/16px var(--f-body);text-align:center}
.bag.selecting .slot:not(.picked){opacity:.8}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick .btn{min-height:34px;font-size:12.5px;padding:4px 10px;box-shadow:0 2px 0 var(--ink)}
.sellbar{position:sticky;bottom:-14px;margin:0 -14px -14px;padding:10px 14px 14px;background:var(--paper);border-top:2px solid var(--ink);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-radius:0 0 22px 22px}
.sellbar b{font:700 15px var(--f-display)}
.sellbar .warn{display:block;font:600 12px var(--f-body);color:var(--hp)}
.slot .lv{position:absolute;bottom:1px;right:4px;font:700 9px var(--f-body)}
.slot.r5{box-shadow:inset 0 0 0 3px #D4A017;background:linear-gradient(135deg,#FFF3B0,#FFD1E8,#C9E6FF)}
.slot.r1{box-shadow:inset 0 0 0 3px #2FAE62}.slot.r2{box-shadow:inset 0 0 0 3px #3F86F5}.slot.r3{box-shadow:inset 0 0 0 3px #A155E8;background:#F6EEFF}.slot.r4{box-shadow:inset 0 0 0 3px #FF8A1F;background:#FFF2E2}
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.detail{display:flex;flex-direction:column;gap:8px}
.opts{font-size:13px;color:#6B4FB8;font-weight:600;display:grid;gap:2px}
.socks{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sock{width:38px;height:38px;border-radius:50%;border:2.5px dashed #B8AECF;background:#F6F2FF;font:700 18px var(--f-body);color:#8F88A0;cursor:pointer;display:grid;place-items:center;line-height:1;padding:0;position:relative}
.sock.full{border-style:solid;background:#fff;font-size:19px}
.sock small{position:absolute;bottom:-4px;right:-4px;font:800 9px var(--f-body);background:#2B2340;color:#fff;border-radius:6px;padding:1px 3px}
.detail .top{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}
.detail .big{width:52px;height:52px;font-size:30px;cursor:default}
.statline{display:flex;flex-wrap:wrap;gap:6px}
.up{color:var(--good);font-weight:700}.down{color:var(--hp);font-weight:700}
.rows{display:flex;flex-direction:column;padding:2px 12px}
.row{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;padding:9px 0;border-bottom:2px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .ico{font-size:24px;text-align:center;line-height:1}
.row .nm{font:700 15px var(--f-display)}
.row .ds{font-size:12px;color:var(--ink-soft);line-height:1.35}
.alloc{display:grid;grid-template-columns:82px 1fr 44px 40px;align-items:center;gap:8px;font:600 13px var(--f-body);padding:4px 0}
.alloc .bar>i{background:#CFC4DE}
.alloc.main .bar>i{background:var(--c)}
.alloc .val{text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.alloc small{color:var(--good);font-weight:600;font-size:11px}
.alloc .btn{width:40px;min-height:34px;padding:0;border-radius:10px;box-shadow:0 3px 0 var(--ink);font-size:18px}
.char-head{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.char-head .portrait{background:var(--c-light);border:2px solid var(--ink);border-radius:18px;padding:6px 8px 2px}
.records{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.records b{display:block;font:700 19px var(--f-display);font-variant-numeric:tabular-nums}
.records span{font-size:12px;color:var(--ink-soft)}
.toast{position:absolute;left:50%;top:170px;transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);font:600 14px var(--f-display);padding:8px 16px;border-radius:99px;animation:rise .2s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
@media (max-width:380px){.ibtn{width:38px;height:38px;font-size:17px}.menu-row{gap:6px}}
@media (max-height:560px){.acts{transform:scale(.85);transform-origin:100% 100%}.chatlog{bottom:96px;width:min(40vw,320px)}.talk{bottom:112px}}
@media (min-width:900px){.acts{bottom:28px;right:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

// Monsters for Lv 20-60 are generated from one level curve so they keep pace with player growth.
function genFoe(name, e, lv, h, a, d, sp, boss, extra) {
  const xp = Math.round(1.8 * Math.pow(lv, 1.4));
  const o = { name, e, hp: Math.round((8.5 * lv + 10) * h), atk: Math.round((2.6 * lv + 3) * a), def: Math.round(1.3 * lv * d), spd: Math.round((6 + lv * .35) * sp), xp, gold: Math.round(xp * .7) };
  if (boss) { o.hp *= 7; o.atk = Math.round(o.atk * 1.3); o.def = Math.round(o.def * 1.2); o.xp *= 10; o.gold *= 8; o.boss = 1; }
  return Object.assign(o, extra || {});
}

function skillNumbers(sk, L) {
  const l = Math.max(1, L), pw = skPow(l), out = [];
  if (sk.mult) out.push(`ดาเมจ ${Math.round(sk.mult * pw * 100)}%`);
  if (sk.n) out.push(`${sk.n} ตัว`);
  if (sk.type === 'heal') out.push(`ฟื้น ${Math.round(sk.amt * (1 + .1 * (l - 1)) * 100)}% HP`);
  if (sk.heal) out.push(`ฟื้น ${Math.round(sk.heal * (1 + .1 * (l - 1)) * 100)}% HP`);
  if (sk.type === 'shield' || sk.shield) out.push(`ลดดาเมจ ${Math.round((sk.amt || sk.shield) * 100)}% ${skDur(sk, l)} วิ`);
  if (sk.type === 'buff') out.push(sk.buff === 'crit' ? `คริ +${Math.round(sk.amt * pw)}% ${skDur(sk, l)} วิ` : `+${Math.round(sk.amt * pw * 100)}% ${skDur(sk, l)} วิ`);
  if (sk.steal) out.push(`ดูดเลือด ${Math.round(sk.steal * 100)}%`);
  out.push(`${sk.cost} MP`, `คูลดาวน์ ${skCd(sk, l).toFixed(1)} วิ`);
  return out.join(' · ');
}

  for (const r of remotes.values()) if (r.pt && !DG && !inDungeonRows(r.ty) && zoneAt(r.x, r.y) === curZ && inView(r.x, r.y)) { const [fk, ak, stg] = r.pt; ents.push({ y: r.y + 8, d: () => drawPet(r.x - r.d * 30, r.y + 8, fk, ak, stg, '') }); }
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) e.d();
  for (const mt of me.meteors) { const k = 1 - mt.t / .6; ctx.fillStyle = `rgba(255,120,40,${.15 + .2 * k})`; ctx.strokeStyle = 'rgba(255,90,31,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mt.x, mt.y, mt.r, 0, 7); ctx.fill(); ctx.stroke(); ctx.drawImage(emojiSprite('☄️', 30), mt.x - 20 + (1 - k) * 60, mt.y - 60 - (1 - k) * 160, 40, 40); }
  for (const f of fx) {
    const k = f.t / f.dur;
    if (f.type === 'trail') { ctx.strokeStyle = `rgba(255,225,74,${.8 * (1 - k)})`; ctx.lineWidth = 14 * (1 - k) + 2; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y2); ctx.stroke(); continue; }
    if (f.type === 'ring') { ctx.strokeStyle = f.c; ctx.globalAlpha = 1 - k; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(f.x, f.y - 10, f.r0 + (f.r1 - f.r0) * k, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
    else if (f.type === 'slash') { ctx.strokeStyle = `rgba(255,255,255,${1 - k})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(f.x, f.y, 18, f.dir > 0 ? -1.3 + k : Math.PI + 1.3 - k, f.dir > 0 ? .4 + k : Math.PI - .4 - k, f.dir < 0); ctx.stroke(); }
    else if (f.type === 'bolt') { ctx.strokeStyle = `rgba(255,225,74,${1 - k})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(f.x, f.y); const n = 5; for (let i = 1; i <= n; i++) ctx.lineTo(f.x + (f.x2 - f.x) * i / n + (i < n ? rnd(-8, 8) : 0), f.y + (f.y2 - f.y) * i / n + (i < n ? rnd(-8, 8) : 0)); ctx.stroke(); }
    else if (f.type === 'emoji') { ctx.globalAlpha = 1 - k; ctx.drawImage(emojiSprite(f.e, 30), f.x - 20, f.y - 20 - k * 20, 40, 40); ctx.globalAlpha = 1; }
    else if (f.type === 'poof') { ctx.fillStyle = `rgba(255,255,255,${.8 * (1 - k)})`; for (let i = 0; i < 6; i++) { const a = i * 1.05; ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * 24 * k, f.y - 16 + Math.sin(a) * 18 * k, 8 * (1 - k) + 2, 0, 7); ctx.fill(); } }
  }
  for (const f of floaters) { ctx.globalAlpha = 1 - Math.max(0, f.t - .5) / .4; drawName(f.text, f.x, f.y - f.t * 40, f.color, `700 ${f.size}px "Mali","IBM Plex Sans Thai",system-ui,sans-serif`); ctx.globalAlpha = 1; }
}
requestAnimationFrame(frame);

/* ================= boot ================= */
loadPrefs(); resize();
const saved = migrate(load());
if (saved) {
  P = saved;
  me.x = num(P.x, SPAWN.x); me.y = num(P.y, SPAWN.y);
  if (P.wv !== 3 || solid(me.x, me.y)) { me.x = SPAWN.x; me.y = SPAWN.y; P.wv = 3; }
  if (solid(me.x, me.y) || inDungeonRows(me.y)) { me.x = SPAWN.x; me.y = SPAWN.y; }
  enterWorld();
} else startEgg();
window.addEventListener('pagehide', save);
})();
